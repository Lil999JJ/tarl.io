<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Tarjetas: Anomalías de la lengua</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1d2330;--mu:#6b7385;--ac:#0f766e;--bd:#dcd8cf;--ok:#15803d;--no:#b45309}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1f242e;--tx:#eceef3;--mu:#9aa3b5;--ac:#2dd4bf;--bd:#333a48;--ok:#4ade80;--no:#fbbf24}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1f242e;--tx:#eceef3;--mu:#9aa3b5;--ac:#2dd4bf;--bd:#333a48;--ok:#4ade80;--no:#fbbf24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:4px 0 12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;font-family:system-ui,sans-serif;font-size:.85rem;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:999px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.prog{font-family:system-ui,sans-serif;font-size:.8rem;color:var(--mu);margin:6px 0}
.pb{height:5px;background:var(--bd);border-radius:3px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.scene{perspective:1200px;margin:14px 0}
.card{position:relative;width:100%;min-height:440px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.card.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;display:flex;flex-direction:column;overflow:auto}
.back{transform:rotateY(180deg)}
.tag{font-family:system-ui,sans-serif;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ac)}
.im{display:flex;gap:8px;margin:10px 0}.im img{flex:1;min-width:0;width:100%;max-height:320px;object-fit:contain;border-radius:10px;background:#0001}
.q{font-size:1.5rem;margin:auto;text-align:center;padding:12px}
.hint{font-family:system-ui,sans-serif;font-size:.75rem;color:var(--mu);text-align:center;margin-top:auto}
.back h2{margin:6px 0;font-size:1.3rem}.back p{margin:6px 0;line-height:1.45;font-size:.97rem}.back .e{color:var(--mu);font-size:.9rem}
.act{display:flex;gap:8px}.act button{flex:1;padding:12px;border-radius:12px}
.back small{display:block;margin-top:8px;color:var(--mu);font-family:system-ui,sans-serif;font-size:.8rem}.nav{display:flex;justify-content:space-between;margin-top:8px}
</style></head><body><main>
<h1>👅 Anomalías de la lengua · Tarjetas de estudio</h1>

<div class="nav"><button id="pv">← Anterior</button><button id="nx">Siguiente →</button></div>

let grp='Todas',mode=0,onlyRv=false,deck=[],ix=0,st={};
const $=id=>document.getElementById(id);
function build(){deck=ALL.filter(c=>(grp=='Todas'||c.g==grp)&&(!onlyRv||st[c.n]=='no'));ix=0;show()}
function show(){const c=$('cd');c.classList.remove('f');
if(!deck.length){$('fr').innerHTML='<div class="q">No hay tarjetas en este filtro 🎉</div>';$('bk').innerHTML='';upd();return}
const d=deck[ix],tg=`<div class="tag">Anomalía · ${ix+1}/${deck.length}</div>`;
const im=d.i.length?`<div class="im">${d.i.map(s=>`<img src="${s}" alt="Foto clínica">`).join('')}</div>`:'';
$('fr').innerHTML=mode==0?tg+im+`<div class="q" style="font-size:1.1rem">${d.i.length?'':'(Sin imagen en tu documento)<br><br>'}${d.i.length?'¿Qué anomalía es y cómo se define?':'¿Qué anomalía es? Pista: '+d.d}</div><div class="hint">Toca para voltear</div>`:tg+`<div class="q">${d.n}</div><div class="hint">Define y da origen, síntomas y tratamiento · toca para voltear</div>`;
$('bk').innerHTML=tg+`<h2>${d.n}</h2>${mode==1?im:''}<p>${d.d}</p><p class="e">${d.e}</p>`;
upd()}
function upd(){const k=ALL.filter(c=>st[c.n]=='ok').length;$('pt').textContent=`Dominadas: ${k} de ${ALL.length}`;$('pi').style.width=100*k/ALL.length+'%'}
function go(n){if(!deck.length)return;ix=(ix+n+deck.length)%deck.length;show()}
$('cd').onclick=()=>$('cd').classList.toggle('f');
$('nx').onclick=()=>go(1);$('pv').onclick=()=>go(-1);
$('ok').onclick=()=>{if(deck.length){st[deck[ix].n]='ok';go(1)}};$('no').onclick=()=>{if(deck.length){st[deck[ix].n]='no';go(1)}};
$('sh').onclick=()=>{deck.sort(()=>Math.random()-.5);ix=0;show()};
$('mode').onclick=e=>{mode^=1;e.target.textContent=mode?'Modo: Nombre → Definición':'Modo: Imagen → Nombre';show()};
$('rv').onclick=e=>{onlyRv=!onlyRv;e.target.classList.toggle('on',onlyRv);build()};
['Todas','Superficie','Tamaño y movilidad','Vasos y tejidos'].forEach(g=>{const b=document.createElement('button');b.textContent=g;b.className=g==grp?'on':'';b.onclick=()=>{grp=g;[...$('flt').children].forEach(x=>x.classList.toggle('on',x===b));build()};$('flt').appendChild(b)});
document.onkeydown=e=>{if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1);if(e.key==' '){e.preventDefault();$('cd').classList.toggle('f')}};
build();
</script></body></html>
